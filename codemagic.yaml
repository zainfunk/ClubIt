workflows:
  ios-build:
    name: ClubIt iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic  # name of your App Store Connect API key in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.clubit.app
      xcode: 16
      node: 20
      vars:
        # MUST be the canonical production domain (NOT *.vercel.app): the native
        # WebView origin has to match where Clerk + cookies live (clubit.app) or
        # the session won't persist in the shell, and Apple 4.2 reads a
        # *.vercel.app shell as "just the website". Keep in sync with
        # allowNavigation in capacitor.config.ts. Override in the Codemagic
        # dashboard only with another clubit.app host.
        APP_SERVER_URL: "https://clubit.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci

      - name: Build Next.js app (production -- strips dev-only routes)
        script: |
          # build:prod composes:
          #   1. node scripts/strip-dev-routes.mjs   (removes app/api/dev/, /app/dev/, etc.)
          #   2. next build
          #   3. node scripts/check-no-dev-routes.mjs (fails the build if any dev-route artifact survived)
          # See finding W1.6 in docs/security/ClubIt-Security-Assessment.md.
          NODE_ENV=production npm run build:prod

      - name: Capacitor sync iOS
        # APP_SERVER_URL env var is read by capacitor.config.ts at sync time
        script: |
          npx cap sync ios

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS app archive
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App

    artifacts:
      - ios/App/build/**/*.ipa
      - ios/App/build/**/*.xcarchive

    publishing:
      email:
        recipients:
          - rithwik@clubit.app  # update with your email
        notify:
          success: true
          failure: true
      # Uncomment to publish to TestFlight automatically:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   beta_groups:
      #     - Internal Testers
